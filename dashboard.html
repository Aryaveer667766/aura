<!DOCTYPE html>
<html lang="en" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | Aura</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Dashboard Navbar -->
    <nav class="w-full bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center text-white font-bold">A</div>
                <span class="font-bold text-xl tracking-tight text-slate-900">Aura</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="create.html" class="hidden sm:inline-block px-4 py-2 rounded-full bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200 transition-colors">
                    + New Event
                </a>
                <button class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold">
                    U
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow py-12 px-6">
        <div class="max-w-5xl mx-auto">
            
            <header class="mb-10">
                <h1 class="text-3xl font-bold text-slate-900">Welcome back</h1>
                <p class="text-slate-500 mt-1">Manage your celebration websites and share your links.</p>
            </header>

            <!-- Events Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="user-events-container">
                
                <!-- Mock Event Card (Will be populated by JS) -->
                <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-1 bg-brand-500"></div>
                    
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="inline-block px-3 py-1 rounded-full bg-brand-50 text-brand-600 text-xs font-bold uppercase tracking-wider mb-3">Wedding</span>
                            <h3 class="text-xl font-bold text-slate-900">Sarah & James</h3>
                            <p class="text-sm text-slate-500 mt-1">Dec 12, 2026</p>
                        </div>
                        <span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-md text-xs font-semibold">Active</span>
                    </div>

                    <div class="bg-slate-50 rounded-xl p-4 mb-6 border border-slate-100">
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Your Custom Link</label>
                        <div class="flex items-center gap-2">
                            <input type="text" readonly value="https://aura.com/event.html?id=evt_98765" class="w-full bg-transparent border-none text-sm text-slate-700 focus:ring-0 p-0 outline-none truncate" id="link-1">
                            <button onclick="copyToClipboard('link-1')" class="p-2 text-brand-600 hover:bg-brand-50 rounded-lg transition-colors flex-shrink-0" title="Copy Link">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <a href="event.html?id=evt_98765" target="_blank" class="flex-1 text-center px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition-colors">
                            View Site
                        </a>
                        <button class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-colors">
                            Edit
                        </button>
                    </div>
                </div>

                <!-- Create New Placeholder -->
                <a href="create.html" class="flex flex-col items-center justify-center bg-transparent rounded-3xl p-6 border-2 border-dashed border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition-colors text-center min-h-[300px] group">
                    <div class="w-14 h-14 bg-slate-100 group-hover:bg-brand-100 group-hover:text-brand-600 rounded-full flex items-center justify-center text-slate-400 mb-4 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                    <h3 class="font-semibold text-slate-900">Create a new website</h3>
                    <p class="text-sm text-slate-500 mt-1">Setup another event for ₹199</p>
                </a>

            </div>
        </div>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
