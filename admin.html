<!DOCTYPE html>
<html lang="en" class="bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control | Aura</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Admin Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6 border-b border-slate-800">
            <div class="flex items-center gap-2 text-white">
                <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center font-bold">A</div>
                <span class="font-bold text-xl tracking-tight">Aura Admin</span>
            </div>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand-500/10 text-brand-400 rounded-xl font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Overview
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                Websites
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Users
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button class="w-full flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Admin Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden" id="admin-content" style="display: none;">
        <!-- Admin Header -->
        <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-sm z-10">
            <h2 class="text-xl font-bold text-slate-800">Dashboard Overview</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-slate-500">Superadmin Mode</span>
                <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm"></div>
            </div>
        </header>

        <!-- Admin Content Scrollable -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- Metrics Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Revenue</p>
                    <h3 class="text-3xl font-bold text-slate-900">₹89,550</h3>
                    <p class="text-sm text-green-600 font-medium mt-2">↑ 12% from last month</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Active Websites</p>
                    <h3 class="text-3xl font-bold text-slate-900">450</h3>
                    <p class="text-sm text-green-600 font-medium mt-2">↑ 34 new this week</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Users</p>
                    <h3 class="text-3xl font-bold text-slate-900">382</h3>
                    <p class="text-sm text-slate-400 font-medium mt-2">Registered accounts</p>
                </div>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="text-lg font-bold text-slate-900">Recent Generations</h3>
                    <button class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">View All</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white border-b border-slate-100">
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Event / ID</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Type</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Date</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Theme</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-slate-100">
                            <!-- JS Will Inject Rows Here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Security Overlay (Shown while checking auth) -->
    <div id="auth-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-8 h-8 border-4 border-brand-200 border-t-brand-500 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-medium text-sm">Verifying admin credentials...</p>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
